# yaml-language-server: $schema=../../../../workflow/briefings/_schema.yaml
# Example: Sam's morning briefing. Inbox first, then the advice, the client
# board, Sam's own GitHub work and the day's calendar. Rows that block the
# Fabrikam service become inbox items so they cannot scroll past.

schema_version: 1
scope: user
id: morning
title: "Morning"
for: sam
default: true
offer_on: ["good morning", "briefing", "what's up"]

view:
  # Tabs a dashboard shows beside the briefing; a section no page names goes to "More".
  pages:
    - id: boards
      title: Boards
      sections:
        - {id: fabrikam, detail: [raw_state, project]}
        - github-mine
    - id: dates
      title: Dates
      sections: [calendar]
  page_rest: show
  # A label in front of every row that names the client.
  marks:
    - {label: FAB, match: [fabrikam], color: magenta}

sections:
  - kind: inbox
    max: 7
  - kind: advise
  - kind: tracker
    id: fabrikam
    title: "Fabrikam board"
    provider: github-board
    query: {boards: [fabrikam-managed-service]}
    max: 10
    to_inbox:
      - when: {state: blocked}
        urgency: now
  - kind: tracker
    id: github-mine
    title: "My GitHub"
    provider: github
    query: {assignee: "@me", owners: [northwind-advisory], review_requested: true}
    cache_minutes: 5        # GitHub is slow: reuse its answer for five minutes
    to_inbox:
      - when: {category: qa, assigned_to_me: true}
  - kind: tasks
    status: [doing, review]
  - kind: calendar
    provider: auto
    days: 1
  - kind: activity
    days: 7
