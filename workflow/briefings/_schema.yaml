# Briefing Profile Schema: JSON Schema Draft 2020-12 in YAML
#
# Validates `workflow/briefings/<id>.yaml`. A profile says what ONE briefing
# shows and from where: which sections, in which order, which tracker with
# which query, and which rows become inbox items. Every person writes their
# own; a Bridge may hold several (a morning one, one per customer, a weekly).
#
# Validation:
#   python3 scripts/briefing.py validate            # what CI runs
#   check-jsonschema --schemafile workflow/briefings/_schema.yaml \
#                    workflow/briefings/<id>.yaml
#
# WHY A FILE AND NOT PROSE. Before profiles the briefing's collection steps
# were instructions an agent re-read on every run, and a run could skip one
# (the trackers were not queried at all in one observed morning). A profile is
# executed by scripts/briefing.py; the agent only advises on and renders what
# the script collected. Model: docs/briefings.md.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://bks-lab.github.io/open-bridge/schemas/briefing.yaml"
title: Briefing profile
description: One briefing a person can ask for, as an ordered list of sections.

type: object
required: [schema_version, scope, id, sections]
additionalProperties: false

properties:
  schema_version:
    const: 1
  scope:
    enum: [core, org, personal, user]
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
    description: "Matches the filename without .yaml. `/briefing <id>` runs it."
  title:
    type: string
  for:
    type: string
    description: "Whose briefing this is. Free text (a handle or name); informational."
  default:
    type: boolean
    description: |
      The profile plain `/briefing` runs. At most one profile may say true;
      bridge-config.yaml `briefing.default` wins when set (the person's choice over a shared file).
  offer_on:
    type: array
    items: {type: string, minLength: 2}
    description: |
      Phrases on which the Bridge offers this profile ("good morning",
      "customer x"). `briefing.py offer "<text>"` matches them.
  timeout_sec:
    type: integer
    minimum: 1
    description: "Per-section time limit. Default 30."
  sections:
    type: array
    minItems: 1
    items: {$ref: "#/$defs/section"}
  view:
    $ref: "#/$defs/view"
  mutes:
    type: array
    items: {$ref: "#/$defs/mute"}
    description: |
      Rows the person never wants to see again ("not this again" on a row adds one).
      The briefing hides them and says how many it hid.

$defs:
  view:
    type: object
    additionalProperties: false
    description: |
      How the briefing is SHOWN (the sections say where the data comes from).
      `briefing.py render --style <style>` overrides the style for one run.
      Bucket rules and every label: docs/briefings.md § Views.
    properties:
      style:
        enum: [sources, triage, brevity, plan, report]
        description: |
          sources: one block per section (default, the briefing as it always was).
          triage: rows sorted by what to do: do, plan, delegate, waiting, drop.
          brevity: the bottom line and the top three with why.
          plan: your rows laid into today's free calendar gaps.
          report: Markdown by exception: one status line naming only what failed
          or needs a look, the first few rows in bold, short lists per bucket with
          the rest counted, tables only where rows compare (calendar, boards, activity).
      headline: {type: boolean, description: "One bottom line on top. Default true."}
      dayline: {type: boolean, description: "The workday as one line (· free, █ busy, ▲ now). Default true; not in brevity."}
      agenda:
        type: boolean
        description: |
          A Calendar block after the headline: every event from now through the
          lookahead, with overlapping events marked and turned into a do row.
          Default true; not in plan (which lays the events out itself).
      report:
        type: object
        additionalProperties: false
        description: "style report: how many rows lead in bold (top, default 3) and per bucket (per_bucket, default 5)."
        properties:
          top: {type: integer, minimum: 1}
          per_bucket: {type: integer, minimum: 1}
      overview:
        enum: [inline, file]
        description: |
          Where Boards and Activity go. inline (default): below the buckets.
          file: `render` writes them to .bridge/briefings/<id>.overview.txt and
          housekeeping names the file, so the text an agent copies into a chat stays short.
      since_last: {type: boolean, description: "Say what is new since the previous run. Default true."}
      lookahead_days:
        type: integer
        minimum: 0
        description: "Due dates and deferred items within today + N days count as now. Default 1."
      max_items: {type: integer, minimum: 1, description: "Rows in the whole briefing, then '+N more'. Default 12."}
      answer_keys: {type: boolean, description: "Number rows and name a letter per answer ('1a 3b'). Default true."}
      hygiene: {enum: [bottom, hide], description: "Housekeeping last, or not at all. Default bottom."}
      color: {enum: [auto, meaning, none], description: "auto/meaning: colour only where it means something."}
      width: {type: integer, minimum: 40, description: "Wrap column. Default 100. Rows wrap at a word."}
      labels:
        type: object
        propertyNames:
          enum: [activity_title, agenda_title, all_clear, back_on, boards_title, bucket_more, busy_until, capped, clash_row, clashes, col_board, col_branch, col_commits, col_days, col_note, col_repo, col_what, col_when, collides, commits, due, end, error, first_title, free_rest, free_until, hidden, housekeeping, info_tag, lage, later, meanwhile, more, muted, new, next_date, no_next, nudge, only_you, overview_file, owed, parallel, report_title, repos_skipped, shutdown, since, st_blocked, st_in_progress, st_new, st_ready, st_review, task, today, tomorrow, waiting_days, why, with, workplace, yours_today]
        additionalProperties: {type: string}
        description: |
          Any word the reader sees, by label name (docs/briefings.md lists them). A
          placeholder must be one the default label has; `briefing.py validate` checks it.
      buckets:
        type: array
        description: "Order, titles, answer options. A bucket left out is hidden and counted."
        items:
          type: object
          required: [id]
          additionalProperties: false
          properties:
            id: {enum: [do, plan, delegate, waiting, drop]}
            title: {type: string}
            options: {type: array, items: {type: string}}
            nudge_after_days: {type: integer, minimum: 1}
      plan:
        type: object
        additionalProperties: false
        properties:
          workday:
            type: object
            additionalProperties: false
            properties:
              start: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
              end: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
          default_minutes: {type: integer, minimum: 1}

  mute:
    type: object
    required: [section, when]
    additionalProperties: false
    properties:
      section: {type: string, description: "A section id of this profile."}
      when: {type: object, minProperties: 1, description: "Same matching as to_inbox rules."}
      note: {type: string}

  rule:
    type: object
    required: [when]
    additionalProperties: false
    properties:
      when:
        type: object
        minProperties: 1
        description: |
          Field → value (or list of values, any matches) over the normalized
          item (trackers/README.md). All fields must match.
      urgency: {enum: [now, today, later]}
      gate: {enum: [free, your-yes, only-you]}

  section:
    type: object
    required: [kind]
    properties:
      kind:
        enum: [inbox, advise, workplace, tasks, activity, commits, calendar, tracker, command]
      id:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*$"
        description: "Stable name inside the profile; keys inbox items. Defaults to kind."
      title: {type: string}
      max:
        type: integer
        minimum: 1
      summary:
        type: boolean
        description: |
          tracker github-board: also one line per board with its open cards per
          state, counted before assigned_to_me and the other filters.
      # commits
      repos:
        type: array
        items: {type: string}
        description: |
          commits: a name the ecosystem files register, or a path (`~`, `${var}` from
          bridge-config identity, relative = from the Bridge root). Default: every
          registered clone, plus this Bridge.
      author:
        oneOf:
          - {type: string}
          - {type: array, items: {type: string}}
        description: "commits: only these authors; `me` is each repository's git user.email."
      all_branches:
        type: boolean
        description: "commits: count every local branch (`--branches`), not only the checked-out one; no stash, no remotes."
      covers:
        type: array
        items: {enum: [prs, meetings, imports, upstream, applications, channels, backups]}
        description: |
          Playbook streams this section takes care of, so `briefing.py owed` stops
          naming them (a github tracker with others_prs covers prs by itself).
      report_ok:
        type: boolean
        description: |
          Say so when this section completed and has nothing open ("<title>: all
          clear"), so a green source reads differently from one that never ran.
          A failed or skipped section never claims it.
      bucket:
        enum: [do, plan, delegate, waiting, drop, none]
        description: "triage: put every row of this section in one bucket (none: leave it out of the view)."
      to_inbox:
        type: array
        items: {$ref: "#/$defs/rule"}
        description: |
          Which rows become inbox items (key briefing:<profile>:<section>:<item>).
          An item whose row is gone closes on the next run of a section that
          completed; an errored section closes nothing.
      # tracker
      provider:
        type: string
        description: |
          tracker: github | github-board | gitlab | ado | jira | linear.
          calendar: icalbuddy | ics | command | auto.
      query:
        type: object
        description: "Provider-specific selection; docs/briefings.md lists each provider's keys."
      account_ref:
        type: string
        description: |
          Path of an identity/accounts/<id>.yaml carrying `base_url` and a
          `token_ref` (a reference URI, never a value). Needed by jira and linear.
      state_map:
        type: object
        additionalProperties:
          enum: [new, ready, in_progress, review, done, blocked, removed]
        description: "Raw tracker state → normalized state, overriding the provider default."
      # tasks
      status:
        type: array
        items: {enum: [backlog, doing, review, done]}
      contexts:
        type: array
        items: {type: string}
        description: "tasks: only tasks whose `context:` is listed."
      # activity / calendar
      days:
        type: integer
        minimum: 0
      path:
        type: string
        description: "calendar ics: a local .ics file."
      exclude_calendars:
        type: array
        items: {type: string}
        description: "calendar icalbuddy: calendar names to leave out (holidays, birthdays)."
      info_calendars:
        type: array
        items: {type: string}
        description: |
          calendar: calendar names whose events are information, not a
          commitment (a family calendar). Shown in the agenda, marked as parallel
          when they overlap; never a clash row and never an advise collision.
          icalbuddy and ics (X-WR-CALNAME) match by name; a command marks an
          event `info: true` or names its `calendar`.
      # command (section kind, or calendar provider)
      argv:
        type: array
        minItems: 1
        items: {type: string}
        description: |
          A program that prints a JSON list of items (normalized schema for a
          section, {title,start,end} for a calendar). Runs from the Bridge root.
    additionalProperties: false
    allOf:
      - if: {properties: {kind: {const: tracker}}}
        then: {required: [provider]}
      - if: {properties: {kind: {const: command}}}
        then: {required: [argv]}
      - if: {properties: {kind: {const: commits}}}
        then: {properties: {days: {minimum: 1}}}
      - if: {properties: {kind: {const: calendar}, provider: {const: command}}, required: [provider]}
        then: {required: [argv]}
